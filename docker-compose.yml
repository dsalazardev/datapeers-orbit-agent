services:
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: orbit-backend
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: orbit-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped